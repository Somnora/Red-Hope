; Was "Top Down BP Game Template" - the UE template's own name, which is what a
; packaged build showed in its window title and About. Everything below was
; simply absent. Director: CompanyName and CopyrightNotice are the two worth a
; second look, since they are assertions rather than facts about the build.
ProjectName=The Red Hope
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "The Red Hope")
ProjectVersion=0.5.0
CompanyName=Somnora
CompanyDistinguishedName=Somnora
CopyrightNotice=Copyright (C) 2026 Somnora. All rights reserved.
Description=A Mars colony simulation: automation, habitation, sovereignty.

[/Script/UnrealEd.ProjectPackagingSettings]
; Ships Notices/ as loose files beside the executable. The DINOv3 licence wants
; "Built with DINOv3" displayed prominently on a website, user interface, about
; page or PRODUCT DOCUMENTATION, and the Tencent Hunyuan licence requires its
; notice to accompany any distribution. Neither is satisfied by a markdown file
; that stays in the source repo.
;
; NonUFS = staged as real files on disk rather than packed into the .pak, so the
; notices are readable without running the game. Verified against UE 5.8's
; ProjectPackagingSettings.h:599; the Path is relative to the project directory.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Notices")

